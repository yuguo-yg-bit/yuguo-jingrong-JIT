<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的农场 - 玉国金融</title>
<link rel="icon" type="image/png" href="Logo.png?v=3.5.2">
<link rel="stylesheet" href="css/style.css">
<style>
.farm-container { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }

.top-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  background: var(--bg-card); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 16px;
  border: 1px solid var(--ice-blue-border);
}
.top-title { font-size: 20px; font-weight: 700; color: var(--gold); }
.top-points { font-size: 16px; font-weight: 700; color: var(--success); }
.top-points .pts-val { font-size: 22px; font-variant-numeric: tabular-nums; }
.top-info { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.top-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--bg-tertiary); }
.badge-auto { color: var(--success); border: 1px solid var(--success); }
.badge-manual { color: var(--warning); border: 1px solid var(--warning); }
.btn-icon {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--ice-blue-border);
  background: var(--bg-tertiary); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-icon:hover { background: var(--bg-card-hover); }
.btn-icon.active { background: var(--success); border-color: var(--success); color: #fff; }

.tab-nav { display: flex; gap: 4px; margin-bottom: 16px; }
.tab-btn {
  flex: 1; padding: 12px; border: 1px solid var(--ice-blue-border); background: var(--bg-card);
  color: var(--text-dim); border-radius: var(--radius-md); cursor: pointer; font-size: 15px; font-weight: 600;
  transition: all 0.15s; text-align: center;
}
.tab-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.tab-btn.active { background: linear-gradient(135deg, rgba(102,187,106,0.2), rgba(102,187,106,0.1)); border-color: var(--success); color: var(--success); }

.panel { display: none; flex-direction: column; gap: 14px; }
.panel.active { display: flex; }

.section-title { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

.card { background: var(--bg-card); border: 1px solid var(--ice-blue-border); border-radius: var(--radius-md); padding: 14px; }
.card-grid { display: grid; gap: 12px; }

.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stock-item {
  background: var(--bg-tertiary); border-radius: 10px; padding: 10px; text-align: center;
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s;
}
.stock-item:hover { border-color: var(--ice-blue); }
.stock-item.empty { opacity: 0.4; cursor: default; }
.stock-item.empty:hover { border-color: transparent; }
.stock-emoji { font-size: 32px; margin-bottom: 4px; }
.stock-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.stock-count { font-size: 12px; color: var(--text-dim); }
.stock-price { font-size: 11px; color: var(--warning); margin-top: 4px; }
.stock-profit { font-size: 11px; color: var(--success); }
.stock-actions { display: flex; gap: 4px; margin-top: 6px; justify-content: center; }

.shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.shelf-item {
  background: var(--bg-tertiary); border-radius: 10px; padding: 12px;
  border: 1px solid transparent; transition: all 0.15s;
}
.shelf-item:hover { border-color: var(--gold); }
.shelf-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.shelf-emoji { font-size: 28px; }
.shelf-name { font-size: 14px; font-weight: 600; flex: 1; }
.shelf-qty { font-size: 12px; color: var(--text-dim); background: var(--bg-primary); padding: 2px 8px; border-radius: 10px; }
.shelf-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--text-dim); }
.shelf-row .val { color: var(--text-primary); font-weight: 600; }
.shelf-sell { font-size: 14px; font-weight: 700; color: var(--gold); text-align: right; margin-top: 4px; }
.shelf-actions { display: flex; gap: 6px; margin-top: 8px; }

.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ice-blue-border); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; background: var(--bg-tertiary); color: var(--text-primary); }
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--ice-blue); border-color: var(--ice-blue); color: #fff; }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.plot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media(min-width:600px) { .plot-grid { grid-template-columns: repeat(3, 1fr); } }
.plot {
  background: var(--bg-tertiary); border-radius: var(--radius-md); padding: 16px 10px; text-align: center;
  border: 2px solid var(--ice-blue-border); cursor: pointer; transition: all 0.2s; min-height: 140px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.plot:hover { transform: translateY(-2px); border-color: var(--ice-blue); }
.plot.empty { opacity: 0.5; }
.plot.empty:hover { border-color: var(--success); opacity: 0.8; }
.plot.growing { border-color: var(--ice-blue); }
.plot.growing.thirsty { border-color: var(--warning); animation: pulse-warn 1.5s infinite; }
.plot.mature { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); animation: pulse-gold 0.8s infinite; }
.plot.withered { border-color: var(--danger); opacity: 0.6; background: #1a1010; }
.plot-emoji { font-size: 42px; }
.plot-name { font-size: 14px; font-weight: 700; }
.plot-sub { font-size: 11px; color: var(--text-dim); }
.plot-bar { width: 80%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.plot-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.plot-bar-fill.growth { background: linear-gradient(90deg, var(--ice-blue), var(--success)); }
.plot-bar-fill.water { background: linear-gradient(90deg, #1a5276, var(--ice-blue)); }
.plot-bar-fill.low { background: linear-gradient(90deg, var(--danger), var(--warning)); }
.badge-mature { background: var(--gold); color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.badge-dead { background: var(--danger); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }

.robot-row { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--bg-primary); border-radius: 8px; }
.robot-toggle { width: 48px; height: 26px; border-radius: 13px; border: none; cursor: pointer; position: relative; transition: background 0.2s; }
.robot-toggle.on { background: var(--success); }
.robot-toggle.off { background: #555; }
.robot-toggle::after { content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: left 0.2s; }
.robot-toggle.on::after { left: 25px; }

.log-list { max-height: 200px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.log-item { display: flex; justify-content: space-between; padding: 6px 8px; background: var(--bg-primary); border-radius: 6px; }
.log-time { color: var(--text-dim); font-size: 10px; white-space: nowrap; }
.log-detail { flex: 1; margin: 0 8px; }
.log-amt { font-weight: 700; }
.log-amt.positive { color: var(--success); }
.log-amt.negative { color: var(--danger); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 1; visibility: visible; }
.modal-overlay.hidden { display: none; }
.modal-box { background: var(--bg-card); border: 1px solid var(--ice-blue-border); border-radius: var(--radius-md); padding: 20px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.modal-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }

.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.input-group input, .input-group select { width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--ice-blue-border); border-radius: 8px; color: var(--text-primary); font-size: 14px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.toast.success { background: #1b5e20; color: #a5d6a7; border: 1px solid var(--success); }
.toast.error { background: #b71c1c; color: #ef9a9a; border: 1px solid var(--danger); }
.toast.info { background: #0d47a1; color: #90caf9; border: 1px solid var(--ice-blue); }

.market-heat-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 6px; }
.market-heat-fill { height: 100%; border-radius: 4px; transition: width 0.5s; background: linear-gradient(90deg, #2196f3, #4caf50, #ff9800, #f44336); }

@keyframes pulse-warn {
  0%, 100% { border-color: var(--warning); }
  50% { border-color: #ff5722; box-shadow: 0 0 8px rgba(255,152,0,0.3); }
}
@keyframes pulse-gold {
  0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.4); }
  50% { box-shadow: 0 0 30px rgba(255,215,0,0.8); }
}

/* 进农场先显示 SVG 加载动画，数据就绪后再显示页面 */
.farm-loader {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--bg-primary);
  transition: opacity .25s ease, visibility .25s ease;
}
.farm-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.farm-loader-text { font-size: 13px; color: var(--text-dim); letter-spacing: .5px; }
</style>
</head>
<body>
<div class="farm-loader" id="farmLoader" aria-busy="true">
  <div id="farmLoaderBrand"></div>
  <div class="farm-loader-text">正在加载农场数据…</div>
</div>
<div class="farm-container" id="app">
  <div class="top-bar">
    <span class="top-title">🌾 我的农场</span>
    <div class="top-info">
      <span class="top-points">⭐ <span class="pts-val" id="ptsDisplay">---</span></span>
      <span class="top-badge" id="marketBadge">市场热度: --</span>
      <span class="top-badge" id="revenueBadge">营收: --</span>
      <span class="top-badge" id="costBadge">成本: --</span>
      <button class="btn-icon" id="btnMusic" title="背景音乐" onclick="FARM.toggleMusic()">🔇</button>
    </div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="shop" onclick="FARM.switchTab('shop')">🏪 商店</button>
    <button class="tab-btn" data-tab="farm" onclick="FARM.switchTab('farm')">🌾 农田</button>
  </div>

  <div class="panel active" id="panelShop">
    <div class="card">
      <div class="section-title">📦 库存</div>
      <div class="stock-grid" id="stockGrid"></div>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="FARM.openRestockModal()">🛒 进货</button>
        <button class="btn btn-success" onclick="FARM.openShelfModal()">📤 上架</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🏷️ 货架商品</div>
      <div class="shelf-grid" id="shelfGrid"></div>
      <div id="shelfEmpty" style="text-align:center;color:var(--text-dim);padding:20px;display:none;">货架空空，进货后上架吧</div>
    </div>

    <div class="card">
      <div class="section-title">🤖 机器人</div>
      <div class="robot-row">
        <span style="flex:1;">🛒 自动进货机器人</span>
        <button class="robot-toggle off" id="toggleRestock" onclick="FARM.toggleRobot('auto_restock')"></button>
        <span id="restockStatus" style="font-size:12px;color:var(--text-dim);">已关闭</span>
      </div>
      <div class="robot-row" style="margin-top:6px;">
        <span style="flex:1;">🌱 自动农场机器人</span>
        <button class="robot-toggle off" id="toggleFarm" onclick="FARM.toggleRobot('auto_farm')"></button>
        <span id="farmStatus" style="font-size:12px;color:var(--text-dim);">已关闭</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">📋 交易日志</div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <div class="panel" id="panelFarm">
    <div class="card">
      <div class="section-title">🌱 农田 (6块地)</div>
      <div class="plot-grid" id="plotGrid"></div>
    </div>

    <div class="card">
      <div class="section-title">🤖 农田机器人</div>
      <div class="robot-row">
        <span style="flex:1;">🌱 自动浇灌+自动种植机器人</span>
        <button class="robot-toggle off" id="toggleFarm2" onclick="FARM.toggleRobot('auto_farm')"></button>
        <span id="farmStatus2" style="font-size:12px;color:var(--text-dim);">已关闭</span>
      </div>
    </div>
  </div>

  <!-- 进货 Modal -->
  <div class="modal-overlay hidden" id="restockModal">
    <div class="modal-box">
      <button class="modal-close" onclick="FARM.closeModal('restockModal')">&times;</button>
      <div class="modal-title">🛒 批发进货</div>
      <div class="input-group">
        <label>商品</label>
        <select id="restockItem" onchange="FARM.onRestockItemChange()">
          <option value="">请选择商品</option>
          <optgroup label="🌱 种子（需要自己种）">
            <option value="seeds_wheat">🌾 小麦种子 - 8分/个</option>
            <option value="seeds_corn">🌽 玉米种子 - 16分/个</option>
            <option value="seeds_strawberry">🍓 草莓种子 - 22分/个</option>
            <option value="seeds_carrot">🥕 胡萝卜种子 - 20分/个</option>
            <option value="seeds_tomato">🍅 番茄种子 - 24分/个</option>
            <option value="seeds_sunflower">🌻 向日葵种子 - 32分/个</option>
          </optgroup>
          <optgroup label="🥕 成熟作物（直接上架卖，不用种）">
            <option value="wheat">🌾 小麦 - 40分/个</option>
            <option value="corn">🌽 玉米 - 80分/个</option>
            <option value="strawberry">🍓 草莓 - 110分/个</option>
            <option value="carrot">🥕 胡萝卜 - 100分/个</option>
            <option value="tomato">🍅 番茄 - 120分/个</option>
            <option value="sunflower">🌻 向日葵 - 160分/个</option>
          </optgroup>
          <optgroup label="🔧 工具">
            <option value="fertilizer_basic">💩 普通肥料 - 12分</option>
            <option value="fertilizer_premium">✨ 高级肥料 - 32分</option>
            <option value="auto_waterer">💧 自动浇灌器 - 120分</option>
          </optgroup>
        </select>
      </div>
      <div class="input-group">
        <label>数量</label>
        <input type="number" id="restockQty" value="1" min="1" max="99" onchange="FARM.onRestockQtyChange()">
      </div>
      <div class="input-group">
        <label>总价：<b id="restockTotal" style="color:var(--warning);">-- 分</b></label>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="FARM.doRestock()">确认进货</button>
    </div>
  </div>

  <!-- 上架 Modal -->
  <div class="modal-overlay hidden" id="shelfModal">
    <div class="modal-box">
      <button class="modal-close" onclick="FARM.closeModal('shelfModal')">&times;</button>
      <div class="modal-title">📤 上架到货架</div>
      <div class="input-group">
        <label>库存中的商品</label>
        <select id="shelfItem"></select>
      </div>
      <div class="input-group">
        <label>利润率（如 0.3 = 30%加价）</label>
        <input type="number" id="shelfProfit" value="0.3" min="0.01" max="5.0" step="0.01" onchange="FARM.onShelfProfitChange()">
      </div>
      <div class="input-group">
        <label>对外售价：<b id="shelfPrice" style="color:var(--gold);">-- 分</b></label>
      </div>
      <button class="btn btn-success" style="width:100%;" onclick="FARM.doShelfAdd()">确认上架</button>
    </div>
  </div>

  <!-- 种植 Modal -->
  <div class="modal-overlay hidden" id="plantModal">
    <div class="modal-box">
      <button class="modal-close" onclick="FARM.closeModal('plantModal')">&times;</button>
      <div class="modal-title">🌱 种植作物</div>
      <div class="input-group">
        <label>选择地块</label>
        <select id="plantPlot">
          <option value="-1">选择空地</option>
        </select>
      </div>
      <div class="input-group">
        <label>选择种子（库存中的）</label>
        <select id="plantSeed" onchange="FARM.onPlantSeedChange()"></select>
      </div>
      <div id="plantInfo" style="font-size:12px;color:var(--text-dim);margin-top:8px;"></div>
      <button class="btn btn-success" style="width:100%;margin-top:12px;" onclick="FARM.doPlant()">确认种植</button>
    </div>
  </div>

  <!-- 地块操作 Modal -->
  <div class="modal-overlay hidden" id="actionModal">
    <div class="modal-box">
      <button class="modal-close" onclick="FARM.closeModal('actionModal')">&times;</button>
      <div class="modal-title" id="actionTitle">操作</div>
      <div style="display:flex;flex-direction:column;gap:8px;" id="actionBtns"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js?v=3.5.3"></script>
<script src="js/api.js?v=3.6.2"></script>
<script src="js/points.js?v=3.6.2"></script>
<script>
(function() {
  var _currentUser = localStorage.getItem("jit_current_user") || "";
  var _currentPoints = 0;
  var _state = null;
  var _shop = null;
  var _farm = null;
  var _tab = "shop";
  var _restockPrices = { seeds_wheat:8, seeds_corn:16, seeds_strawberry:22, seeds_carrot:20, seeds_tomato:24, seeds_sunflower:32, fertilizer_basic:12, fertilizer_premium:32, auto_waterer:120, wheat:40, corn:80, strawberry:110, carrot:100, tomato:120, sunflower:160 };
  var _cropCfg = { wheat:{name:"小麦",emoji:"🌾",gh:2,wh:4,wih:6}, corn:{name:"玉米",emoji:"🌽",gh:4,wh:6,wih:8}, strawberry:{name:"草莓",emoji:"🍓",gh:3,wh:5,wih:7}, carrot:{name:"胡萝卜",emoji:"🥕",gh:5,wh:7,wih:10}, tomato:{name:"番茄",emoji:"🍅",gh:6,wh:8,wih:12}, sunflower:{name:"向日葵",emoji:"🌻",gh:8,wh:8,wih:14} };
  var _seedMap = { seeds_wheat:"wheat", seeds_corn:"corn", seeds_strawberry:"strawberry", seeds_carrot:"carrot", seeds_tomato:"tomato", seeds_sunflower:"sunflower" };
  var _musicPlaying = false;
  var _audioCtx = null;
  var _musicGain = null;
  var _sessionRedirecting = false;

  // 会话失效时清掉本地登录态并回到登录页，避免每个接口都返回 HTTP 403
  function _requireLogin(msg) {
    if (_sessionRedirecting) return;
    _sessionRedirecting = true;
    try {
      localStorage.removeItem("jit_current_user");
      localStorage.removeItem("jit_session_token");
      localStorage.removeItem("jit_session_user");
      localStorage.removeItem("jit_session_role");
    } catch(e) {}
    alert(msg);
    window.location.replace("login.html?return=/farm");
  }

  if (!_currentUser) { _requireLogin("请先登录后再进入农场"); return; }

  var _sessionToken = localStorage.getItem("jit_session_token") || "";
  var _sessionUser = localStorage.getItem("jit_session_user") || "";
  if (!_sessionToken || (_sessionUser && _sessionUser !== _currentUser)) {
    _requireLogin("登录状态已失效，请重新登录后进入农场");
    return;
  }

  function game(action, params) {
    if (typeof JITApi === "undefined" || !JITApi.getTursoHelpers) {
      return Promise.reject(new Error("API 未就绪，请刷新页面"));
    }
    return JITApi.getTursoHelpers().gameAction(_currentUser, action, params).catch(function(e) {
      var msg = (e && e.message) || "";
      if (msg.indexOf("403") !== -1 || msg.indexOf("会话") !== -1 || msg.indexOf("禁止操作") !== -1) {
        _requireLogin("登录已过期，请重新登录后进入农场");
      }
      throw e;
    });
  }

  function refreshPoints() {
    var p;
    if (typeof JITPoints !== "undefined" && JITPoints.getUserPoints) { p = JITPoints.getUserPoints(_currentUser, true); }
    else { p = Promise.resolve({ points: 0 }); }
    return p.then(function(r) { _currentPoints = Math.max(0, Number(r.points) || 0); document.getElementById("ptsDisplay").textContent = _currentPoints; }).catch(function(){ document.getElementById("ptsDisplay").textContent = "---"; });
  }

  function showToast(msg, type) {
    var el = document.getElementById("toast");
    el.innerHTML = msg; el.className = "toast " + (type||"info") + " show";
    clearTimeout(el._timer);
    el._timer = setTimeout(function(){ el.classList.remove("show"); }, 2500);
  }

  // ====== 背景音乐（Web Audio 环境音） ======
  function initMusic() {
    try {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      _musicGain = _audioCtx.createGain();
      _musicGain.gain.value = 0.08;
      _musicGain.connect(_audioCtx.destination);
      var osc1 = _audioCtx.createOscillator();
      osc1.type = "sine"; osc1.frequency.value = 220;
      var osc2 = _audioCtx.createOscillator();
      osc2.type = "sine"; osc2.frequency.value = 330;
      var osc3 = _audioCtx.createOscillator();
      osc3.type = "triangle"; osc3.frequency.value = 440;
      var lfo = _audioCtx.createOscillator();
      lfo.type = "sine"; lfo.frequency.value = 0.3;
      var lfoGain = _audioCtx.createGain();
      lfoGain.gain.value = 1;
      lfo.connect(lfoGain);
      lfoGain.connect(osc1.detune);
      lfoGain.connect(osc2.detune);
      osc1.connect(_musicGain);
      osc2.connect(_musicGain);
      osc3.connect(_musicGain);
      osc1.detune.value = -10;
      osc2.detune.value = 5;
      _musicGain.gain.value = 0.06;
      osc1.start(); osc2.start(); osc3.start(); lfo.start();
      _musicPlaying = true;
      document.getElementById("btnMusic").textContent = "🔊";
      document.getElementById("btnMusic").classList.add("active");
    } catch(e) { console.log("音乐初始化失败:", e); }
  }

  function toggleMusic() {
    if (!_audioCtx) { initMusic(); return; }
    if (_audioCtx.state === "suspended") { _audioCtx.resume(); }
    _musicPlaying = !_musicPlaying;
    _musicGain.gain.value = _musicPlaying ? 0.06 : 0;
    document.getElementById("btnMusic").textContent = _musicPlaying ? "🔊" : "🔇";
    if (_musicPlaying) { document.getElementById("btnMusic").classList.add("active"); }
    else { document.getElementById("btnMusic").classList.remove("active"); }
  }

  // ====== 数据加载 ======
  function loadState(isRetry) {
    return game("tick").then(function(r) {
      _state = r.state; _shop = r.shop; _farm = (r.farm || []).slice(0,6);
      if (r.pointsChange && r.pointsChange !== 0) { refreshPoints(); }
      return r;
    }).catch(function(e) {
      var msg = (e && e.message) || "";
      // 引擎冷启动偶发 5xx，自动重试一次
      if (!isRetry && /HTTP 5\d\d/.test(msg)) {
        showToast("服务器繁忙，正在重试…", "info");
        return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return loadState(true); });
      }
      throw e;
    });
  }

  // ====== Tab 切换 ======
  function switchTab(tab) {
    _tab = tab;
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === tab); });
    document.getElementById("panelShop").classList.toggle("active", tab === "shop");
    document.getElementById("panelFarm").classList.toggle("active", tab === "farm");
    render();
  }

  // ====== 渲染 ======
  function render() {
    if (_state) {
      var mh = (_state.marketHeat * 100).toFixed(0);
      document.getElementById("marketBadge").textContent = "市场热度: " + mh + "%";
      document.getElementById("revenueBadge").textContent = "营收: " + (_state.totalRevenue||0) + "分";
      document.getElementById("costBadge").textContent = "成本: " + (_state.totalCost||0) + "分";
      var restockOn = !!_state.autoRestock;
      var farmOn = !!_state.autoFarm;
      ["toggleRestock","toggleFarm","toggleFarm2"].forEach(function(id){
        var el = document.getElementById(id); if(!el) return;
        el.classList.toggle("on", id.indexOf("Restock")>-1 ? restockOn : farmOn);
        el.classList.toggle("off", id.indexOf("Restock")>-1 ? !restockOn : !farmOn);
      });
      document.getElementById("restockStatus").textContent = restockOn ? "运行中" : "已关闭";
      document.getElementById("farmStatus").textContent = farmOn ? "运行中" : "已关闭";
      var fs2 = document.getElementById("farmStatus2"); if(fs2) fs2.textContent = farmOn ? "运行中" : "已关闭";
    }
    if (_tab === "shop") renderShop();
    else renderFarm();
  }

  // ====== 商店渲染 ======
  function renderShop() {
    var stock = _shop ? _shop.stock : {};
    var shelves = _shop ? _shop.shelves : [];
    var logs = _shop ? _shop.logs : [];

    var stockHtml = "";
    var allSeedTypes = Object.keys(_seedMap);
    for (var i=0;i<allSeedTypes.length;i++) {
      var sid = allSeedTypes[i], ct = _seedMap[sid];
      var qty = stock[sid]||0;
      var cfg = _cropCfg[ct];
      var cost = _restockPrices[sid]||0;
      stockHtml += '<div class="stock-item'+(qty<=0?" empty":"")+'" onclick="'+(qty>0?"FARM.openShelfModal('"+sid+"')":"")+'">';
      stockHtml += '<div class="stock-emoji">'+(cfg?cfg.emoji:"📦")+'</div>';
      stockHtml += '<div class="stock-name">'+(cfg?cfg.name:ct)+' 种子</div>';
      stockHtml += '<div class="stock-count">x'+qty+'</div>';
      stockHtml += '<div class="stock-price">进价 '+cost+'分</div>';
      stockHtml += '</div>';
    }
    // 工具类库存
    var toolTypes = ["fertilizer_basic","fertilizer_premium","auto_waterer"];
    var toolNames = { fertilizer_basic:"💩 普通肥料", fertilizer_premium:"✨ 高级肥料", auto_waterer:"💧 自动浇灌器" };
    var toolEmojis = { fertilizer_basic:"💩", fertilizer_premium:"✨", auto_waterer:"💧" };
    for (var j=0;j<toolTypes.length;j++) {
      var tid = toolTypes[j], tqty = stock[tid]||0, tcost = _restockPrices[tid]||0;
      stockHtml += '<div class="stock-item'+(tqty<=0?" empty":"")+'">';
      stockHtml += '<div class="stock-emoji">'+(toolEmojis[tid]||"📦")+'</div>';
      stockHtml += '<div class="stock-name">'+(toolNames[tid]||tid).slice(2)+'</div>';
      stockHtml += '<div class="stock-count">x'+tqty+'</div>';
      stockHtml += '<div class="stock-price">进价 '+tcost+'分</div>';
      stockHtml += '</div>';
    }
    // 作物库存
    var cropKeys = Object.keys(_cropCfg);
    for (var k=0;k<cropKeys.length;k++) {
      var ck = cropKeys[k], cqty = stock[ck]||0;
      if (cqty<=0 && !stock.hasOwnProperty(ck)) continue;
      var cc = _cropCfg[ck];
      var shelfCost = cc.gh * 5;
      stockHtml += '<div class="stock-item'+(cqty<=0?" empty":"")+'" onclick="'+(cqty>0?"FARM.openShelfModal('"+ck+"')":"")+'">';
      stockHtml += '<div class="stock-emoji">'+(cc?cc.emoji:"📦")+'</div>';
      stockHtml += '<div class="stock-name">'+(cc?cc.name:ck)+'</div>';
      stockHtml += '<div class="stock-count">x'+cqty+'</div>';
      stockHtml += '<div class="stock-price">成本 ~'+shelfCost+'分</div>';
      stockHtml += '</div>';
    }
    document.getElementById("stockGrid").innerHTML = stockHtml || '<div style="color:var(--text-dim);grid-column:1/-1;text-align:center;">库存为空，先进货吧</div>';

    var shelfHtml = "";
    for (var s=0;s<shelves.length;s++) {
      var sh = shelves[s];
      var shEmoji = "📦";
      var itemCfg = _cropCfg[sh.itemId] || _cropCfg[String(sh.itemId).replace(/^seeds_/,"")];
      if (itemCfg) shEmoji = itemCfg.emoji;
      else if (sh.itemId === "fertilizer_basic") shEmoji = "💩";
      else if (sh.itemId === "fertilizer_premium") shEmoji = "✨";
      else if (sh.itemId === "auto_waterer") shEmoji = "💧";
      shelfHtml += '<div class="shelf-item">';
      shelfHtml += '<div class="shelf-top"><span class="shelf-emoji">'+shEmoji+'</span><span class="shelf-name">'+sh.itemName+'</span><span class="shelf-qty">x'+sh.quantity+'</span></div>';
      shelfHtml += '<div class="shelf-row"><span>成本</span><span class="val">'+sh.costPrice+'分</span></div>';
      shelfHtml += '<div class="shelf-row"><span>利润率</span><span class="val">'+(sh.profitPct*100).toFixed(0)+'%</span></div>';
      shelfHtml += '<div class="shelf-sell">💰 '+sh.sellPrice+' 分</div>';
      shelfHtml += '<div class="shelf-actions">';
      shelfHtml += '<button class="btn btn-sm" onclick="FARM.openShelfUpdateModal(\''+sh.id+'\','+sh.profitPct+')">调价</button>';
      shelfHtml += '<button class="btn btn-sm btn-danger" onclick="FARM.doShelfRemove(\''+sh.id+'\')">下架</button>';
      shelfHtml += '</div></div>';
    }
    document.getElementById("shelfGrid").innerHTML = shelfHtml;
    document.getElementById("shelfEmpty").style.display = shelves.length === 0 ? "block" : "none";

    var logHtml = "";
    for (var l=0;l<logs.length;l++) {
      var lg = logs[l];
      var amtClass = lg.amount > 0 ? "positive" : (lg.amount < 0 ? "negative" : "");
      logHtml += '<div class="log-item">';
      logHtml += '<span class="log-time">'+(lg.createdAt||"").slice(11,19)+'</span>';
      logHtml += '<span class="log-detail">'+lg.detail+'</span>';
      logHtml += '<span class="log-amt '+amtClass+'">'+(lg.amount>0?"+":"")+lg.amount+'分</span>';
      logHtml += '</div>';
    }
    document.getElementById("logList").innerHTML = logHtml || '<div style="color:var(--text-dim);text-align:center;">暂无交易记录</div>';
  }

  // ====== 农田渲染 ======
  function renderFarm() {
    var html = "";
    for (var i=0;i<6;i++) {
      var plot = _farm[i] || { plotIndex:i, cropType:null, status:"empty", plantedAt:null, growthHours:0, waterHours:0, wiltHours:0, lastWatered:null };
      var cls = "plot";
      var emoji = "🌱";
      var name = "空地";
      var sub = "点击种植";
      var extra = "";
      var growthPct = 0, waterPct = 100;
      var nowMs = Date.now();

      if (plot.status === "growing" && plot.cropType) {
        cls += " growing";
        var cfg = _cropCfg[plot.cropType] || {};
        var plantedMs = plot.plantedAt ? new Date(plot.plantedAt).getTime() : nowMs;
        var elapsedH = (nowMs - plantedMs) / 3600000;
        growthPct = Math.min(1, elapsedH / (plot.growthHours||1));
        var stage = growthPct >= 1 ? 4 : (growthPct >= 0.7 ? 3 : (growthPct >= 0.35 ? 2 : (growthPct >= 0.1 ? 1 : 0)));
        var stages = ["🌰","🌱","🌿","🌳"];
        emoji = stages[stage] || stages[3];
        name = cfg.name || plot.cropType;

        var lastWaterMs = plot.lastWatered ? new Date(plot.lastWatered).getTime() : plantedMs;
        var waterElapsedH = (nowMs - lastWaterMs) / 3600000;
        waterPct = Math.max(0, Math.round(100 - (waterElapsedH / (plot.waterHours||1)) * 100));
        if (waterPct < 50) cls += " thirsty";
        sub = "⏳" + (growthPct>=1?"可收获！":Math.ceil((plot.growthHours||1)*(1-growthPct))+"h") + " · 💧" + waterPct + "%";
      } else if (plot.status === "mature" && plot.cropType) {
        cls += " mature";
        var cfg2 = _cropCfg[plot.cropType] || {};
        emoji = cfg2.emoji || "🌾";
        name = cfg2.name || plot.cropType;
        growthPct = 1; waterPct = 100;
        sub = "✨ 可收获！"; extra = '<div class="badge-mature">成熟</div>';
      } else if (plot.status === "withered" && plot.cropType) {
        cls += " withered";
        var cfg3 = _cropCfg[plot.cropType] || {};
        emoji = "💀"; name = cfg3.name || plot.cropType;
        sub = "已枯死"; extra = '<div class="badge-dead">清除</div>';
      } else { cls += " empty"; }

      html += '<div class="'+cls+'" onclick="FARM.onPlotClick('+i+')">';
      html += '<div class="plot-emoji" style="'+(plot.status==="mature"?"font-size:52px;":"")+'">'+emoji+'</div>';
      html += '<div class="plot-name">'+name+'</div>';
      html += '<div class="plot-sub">'+sub+'</div>';
      if (plot.status === "growing") {
        html += '<div class="plot-bar"><div class="plot-bar-fill growth" style="width:'+Math.round(growthPct*100)+'%"></div></div>';
        html += '<div class="plot-bar"><div class="plot-bar-fill '+(waterPct<50?'low':'water')+'" style="width:'+waterPct+'%"></div></div>';
      }
      html += extra;
      html += '</div>';
    }
    document.getElementById("plotGrid").innerHTML = html;
  }

  // ====== 地块点击 ======
  function onPlotClick(idx) {
    var plot = _farm[idx];
    if (!plot) return;
    if (plot.status === "empty") { openPlantModal(idx); }
    else if (plot.status === "mature") { doHarvest(idx); }
    else if (plot.status === "withered") { doClearDead(idx); }
    else if (plot.status === "growing") { openActionModal(idx); }
  }

  // ====== 种植 ======
  function openPlantModal(presetIdx) {
    var sel = document.getElementById("plantPlot");
    sel.innerHTML = "";
    for (var i=0;i<6;i++) {
      var p = _farm[i];
      if (p && p.status === "empty") {
        sel.innerHTML += '<option value="'+i+'"'+(i===presetIdx?" selected":"")+'>地块 #'+(i+1)+'</option>';
      }
    }
    if (!sel.options.length) { showToast("没有空地了！先收获或清除枯死的作物吧", "info"); return; }

    var stock = _shop ? _shop.stock : {};
    var seedSel = document.getElementById("plantSeed");
    seedSel.innerHTML = '<option value="">选择种子</option>';
    var seedKeys = Object.keys(_seedMap);
    for (var j=0;j<seedKeys.length;j++) {
      var sid = seedKeys[j], ct = _seedMap[sid];
      var qty = stock[sid]||0;
      if (qty > 0) {
        var cfg = _cropCfg[ct];
        seedSel.innerHTML += '<option value="'+ct+'">'+cfg.emoji+' '+cfg.name+' (库存:'+qty+')</option>';
      }
    }
    document.getElementById("plantInfo").textContent = "";
    document.getElementById("plantModal").classList.remove("hidden");
  }

  function onPlantSeedChange() {
    var ct = document.getElementById("plantSeed").value;
    var cfg = _cropCfg[ct];
    if (cfg) {
      document.getElementById("plantInfo").innerHTML = "⏳生长期:"+cfg.gh+"h · 💧需每"+cfg.wh+"h浇水 · 💀"+cfg.wih+"h枯死";
    } else { document.getElementById("plantInfo").textContent = ""; }
  }

  function doPlant() {
    var pi = parseInt(document.getElementById("plantPlot").value);
    var ct = document.getElementById("plantSeed").value;
    if (pi < 0 || !ct) { showToast("请选择地块和种子", "error"); return; }
    game("plant", { plotIndex: pi, cropType: ct }).then(function(r) {
      _farm = r.farm.slice(0,6); _shop = r.shop || _shop;
      closeModal("plantModal"); render(); showToast("种下了！", "success");
    }).catch(function(e){ showToast("种植失败: "+(e.message||""), "error"); });
  }

  // ====== 收获 ======
  function doHarvest(idx) {
    var plot = _farm[idx];
    var ct = plot.cropType;
    var cfg = _cropCfg[ct] || {};
    game("harvest", { plotIndex: idx }).then(function(r) {
      _farm = r.farm.slice(0,6); _shop = r.shop;
      refreshPoints(); render(); showToast("🌾 收获了"+(cfg.name||ct)+"！已存入库存", "success");
      if (confirm("收获的"+cfg.emoji+" "+cfg.name+" 已入库，要直接上架到货架卖吗？")) {
        openShelfModal(ct);
      }
    }).catch(function(e){ showToast("收获失败: "+(e.message||""), "error"); });
  }

  // ====== 浇水 ======
  function doWater(idx) {
    game("water", { plotIndex: idx }).then(function(r) {
      _farm = r.farm.slice(0,6); closeModal("actionModal"); refreshPoints(); render(); showToast("💧 浇了水！", "success");
    }).catch(function(e){ showToast("浇水失败: "+(e.message||""), "error"); });
  }

  // ====== 清除枯死 ======
  function doClearDead(idx) {
    game("clear_dead", { plotIndex: idx }).then(function(r) {
      _farm = r.farm.slice(0,6); render(); showToast("清除了枯死作物", "info");
    }).catch(function(e){ showToast("清除失败: "+(e.message||""), "error"); });
  }

  // ====== 地块操作 ======
  function openActionModal(idx) {
    var plot = _farm[idx];
    var cfg = _cropCfg[plot.cropType] || {};
    document.getElementById("actionTitle").textContent = (cfg.emoji||"") + " " + (cfg.name||plot.cropType) + " 操作";
    document.getElementById("actionBtns").innerHTML =
      '<button class="btn btn-primary" onclick="FARM.doWater('+idx+')">💧 浇水</button>' +
      '<button class="btn btn-success" onclick="FARM.doHarvest('+idx+')">🌾 收获（如果成熟了）</button>';

  // ====== 进货 ======
  function openRestockModal() {
    document.getElementById("restockItem").value = "";
    document.getElementById("restockQty").value = "1";
    document.getElementById("restockTotal").textContent = "-- 分";
    document.getElementById("restockModal").classList.remove("hidden");
  }

  function onRestockItemChange() {
    var itemId = document.getElementById("restockItem").value;
    var qty = parseInt(document.getElementById("restockQty").value)||1;
    var cost = _restockPrices[itemId]||0;
    document.getElementById("restockTotal").textContent = (cost * qty) + " 分";
  }

  function onRestockQtyChange() { onRestockItemChange(); }

  function doRestock() {
    var itemId = document.getElementById("restockItem").value;
    var qty = parseInt(document.getElementById("restockQty").value)||1;
    if (!itemId) { showToast("请选择商品", "error"); return; }
    var totalCost = (_restockPrices[itemId]||0)*qty;
    if (_currentPoints < totalCost) { showToast("积分不足！需要"+totalCost+"分，你只有"+_currentPoints+"分", "error"); return; }
    var btn = document.querySelector("#restockModal .btn-primary");
    if (btn) { btn.disabled = true; btn.textContent = "进货中..."; }
    game("restock", { itemId: itemId, quantity: qty }).then(function(r) {
      _shop = r.shop; closeModal("restockModal"); refreshPoints(); render();
      showToast("进货成功！", "success");
    }).catch(function(e){
      var m = (e && e.message) || "";
      if (m.indexOf("积分操作失败") !== -1) m = "服务器繁忙，请稍后重试";
      showToast("进货失败: " + m, "error");
    })
    .finally(function(){
      if (btn) { btn.disabled = false; btn.textContent = "确认进货"; }
    });
  }

  // ====== 上架 ======
  function openShelfModal(presetItem) {
    var stock = _shop ? _shop.stock : {};
    var sel = document.getElementById("shelfItem");
    sel.innerHTML = '<option value="">选择商品</option>';
    var keys = Object.keys(stock);
    for (var i=0;i<keys.length;i++) {
      if (stock[keys[i]] > 0) {
        var isCrop = _cropCfg[keys[i]];
        var displayName = isCrop ? (isCrop.emoji+" "+isCrop.name) : keys[i];
        sel.innerHTML += '<option value="'+keys[i]+'"'+(keys[i]===presetItem?" selected":"")+'>'+displayName+' (库存:'+stock[keys[i]]+')</option>';
      }
    }
    document.getElementById("shelfProfit").value = "0.3";
    document.getElementById("shelfPrice").textContent = "-- 分";
    document.getElementById("shelfModal").classList.remove("hidden");
  }

  function onShelfProfitChange() {
    var itemId = document.getElementById("shelfItem").value;
    var pct = parseFloat(document.getElementById("shelfProfit").value)||0.3;
    var cost = _restockPrices[itemId];
    if (!cost) {
      var base = String(itemId).replace(/^seeds_/, "");
      if (_cropCfg[base]) cost = _cropCfg[base].gh * 5;
    }
    if (!cost) cost = 20;
    var price = Math.round(cost * (1 + pct));
    document.getElementById("shelfPrice").textContent = price + " 分";
  }

  function doShelfAdd() {
    var itemId = document.getElementById("shelfItem").value;
    var pct = parseFloat(document.getElementById("shelfProfit").value)||0.3;
    if (!itemId) { showToast("请选择商品", "error"); return; }
    game("shelf_add", { itemId: itemId, profitPct: pct }).then(function(r) {
      _shop = r.shop; closeModal("shelfModal"); render();
      showToast("上架成功！", "success");
    }).catch(function(e){ showToast("上架失败: "+(e.message||""), "error"); });
  }

  function openShelfUpdateModal(shelfId, curPct) {
    document.getElementById("shelfProfit").value = curPct;
    document.getElementById("shelfItem").value = "";
    document.getElementById("shelfPrice").textContent = "-- 分";
    document.getElementById("shelfModal").classList.remove("hidden");
    var oldBtn = document.querySelector("#shelfModal .btn-success");
    if (oldBtn) oldBtn.outerHTML = '<button class="btn btn-primary" style="width:100%;" onclick="FARM.doShelfUpdate(\''+shelfId+'\')">确认调价</button>';
  }

  function doShelfUpdate(shelfId) {
    var pct = parseFloat(document.getElementById("shelfProfit").value)||0.3;
    game("shelf_update", { shelfId: shelfId, profitPct: pct }).then(function(r) {
      _shop = r.shop; closeModal("shelfModal");
      var oldBtn = document.querySelector("#shelfModal .btn-primary");
      if (oldBtn) oldBtn.outerHTML = '<button class="btn btn-success" style="width:100%;" onclick="FARM.doShelfAdd()">确认上架</button>';
      render(); showToast("价格已更新！", "success");
    }).catch(function(e){ showToast("调价失败: "+(e.message||""), "error"); });
  }

  function doShelfRemove(shelfId) {
    if (!confirm("确定下架这个商品吗？库存会退回")) return;
    game("shelf_remove", { shelfId: shelfId }).then(function(r) {
      _shop = r.shop; render(); showToast("已下架", "info");
    }).catch(function(e){ showToast("下架失败: "+(e.message||""), "error"); });
  }

  // ====== 机器人 ======
  function toggleRobot(type) {
    game("toggle_robot", { robotType: type }).then(function(r) {
      _state = r.state; render();
      showToast((type==="auto_restock"?"进货机器人":"农场机器人") + (r.state[type==="auto_restock"?"autoRestock":"autoFarm"]?" 已开启":" 已关闭"), "success");
    }).catch(function(e){ showToast("操作失败: "+(e.message||""), "error"); });
  }

  // ====== Modal ======
  function closeModal(id) {
    document.getElementById(id).classList.add("hidden");
    if (id === "shelfModal") {
      var oldBtn = document.querySelector("#shelfModal .btn-primary");
      if (oldBtn) oldBtn.outerHTML = '<button class="btn btn-success" style="width:100%;" onclick="FARM.doShelfAdd()">确认上架</button>';
    }
  }

  // ====== 定时 TICK（引擎同步） ======
  function doTick() {
    loadState().then(function(r) {
      render(); refreshPoints();
      if (r.tickElapsed > 60) { showToast("引擎结算了 "+Math.round(r.tickElapsed/60)+" 分钟的离线数据", "info"); }
    }).catch(function(e){ console.log("tick error:", e); });
  }

  // ====== 初始化 ======
  function hideFarmLoader() {
    var el = document.getElementById("farmLoader");
    if (!el || el.classList.contains("hidden")) return;
    el.classList.add("hidden");
    el.setAttribute("aria-busy", "false");
  }
  function init() {
    var brand = document.getElementById("farmLoaderBrand");
    if (brand && window._JIT_LOADING_SVG) brand.innerHTML = window._JIT_LOADING_SVG;
    // 兜底：接口异常时不要永久挡住页面
    setTimeout(hideFarmLoader, 20000);
    var ptsEl = document.getElementById("ptsDisplay");
    if (ptsEl) ptsEl.textContent = "加载中...";
    loadState().then(function() { render(); return refreshPoints(); }).then(function() {
      hideFarmLoader();
    }).catch(function(e) {
      console.error("农场加载失败:", e);
      showToast("加载失败：" + (e.message || "未知错误"), "error");
      refreshPoints();
      hideFarmLoader();
    });
    setInterval(function() { doTick(); }, 30000);
  }

  // 全局暴露
  window.FARM = {
    switchTab: switchTab, toggleMusic: toggleMusic, toggleRobot: toggleRobot,
    onPlotClick: onPlotClick, onPlantSeedChange: onPlantSeedChange, doPlant: doPlant,
    doWater: doWater, doHarvest: doHarvest, doClearDead: doClearDead,
    openRestockModal: openRestockModal, onRestockItemChange: onRestockItemChange,
    onRestockQtyChange: onRestockQtyChange, doRestock: doRestock,
    openShelfModal: openShelfModal, onShelfProfitChange: onShelfProfitChange,
    doShelfAdd: doShelfAdd, openShelfUpdateModal: openShelfUpdateModal,
    doShelfUpdate: doShelfUpdate, doShelfRemove: doShelfRemove,
    closeModal: closeModal
  };

  init();
})();
</script>
</body>
</html>
